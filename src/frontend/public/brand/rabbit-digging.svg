<svg xmlns="http://www.w3.org/2000/svg" width="96" height="80" viewBox="0 -8 96 88" fill="none">
  <style>
    .rabbit { animation: dig-bob .7s ease-in-out infinite; transform-origin: 50px 59px; }
    .paw { animation: dig-paw .7s ease-in-out infinite; transform-origin: 57px 56px; }
    .paw-back { animation-delay: -.35s; }
    .soil { animation: dig-soil .7s ease-out infinite; }
    .soil-back { animation-delay: -.35s; }
    @keyframes dig-bob { 0%, 100% { transform: rotate(-3deg); } 50% { transform: translateY(2px) rotate(4deg); } }
    @keyframes dig-paw { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(24deg); } }
    @keyframes dig-soil { 0%, 25% { opacity: 0; transform: translate(0, 0); } 35% { opacity: 1; } 100% { opacity: 0; transform: translate(-18px, -9px); } }
    @media (prefers-reduced-motion: reduce) { .rabbit, .paw, .soil { animation: none; } .soil { opacity: .45; } }
  </style>
  <ellipse cx="65" cy="71" rx="23" ry="4" fill="#263d32" opacity=".12"/>
  <g stroke="#263d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g class="rabbit">
      <path d="M28 64C12 62 13 46 23 43c9-3 19 4 21 13"/>
      <path d="M17 49c-8-7-13 3-5 7"/>
      <g transform="translate(34 3) rotate(18 25 40) scale(.8)">
        <path d="M13 39C4 30 0 7 6 2c8 1 18 22 20 34C24 23 31 7 39 2c7 5 5 24-2 35 7 2 9 8 10 11l3 3c0 5-4 8-10 12H8C3 53 4 45 13 39Z" transform="translate(1 0) scale(.93)"/>
        <circle cx="35" cy="45" r="2" fill="#263d32" stroke="none"/>
      </g>
      <path class="paw paw-back" d="M53 55q11 4 17 10q-1 4-7 2" opacity=".5"/>
      <path class="paw" d="M48 57q8 9 19 11q3 4-4 4l-15-7"/>
      <path d="M29 55q-9 3-5 10h14"/>
    </g>
    <path class="soil" d="m44 70-3-1m-5 3-2 1"/>
    <path class="soil soil-back" d="m48 71-2 1"/>
  </g>
</svg>
