<svg xmlns="http://www.w3.org/2000/svg" width="96" height="80" viewBox="150 30 1120 1060" fill="none">
  <style>
    .rabbit { animation: rabbit-lean 1.1s ease-in-out infinite; transform-origin: 490px 970px; }
    .forepaw { animation: rabbit-dig 1.1s ease-in-out infinite; transform-origin: 742px 744px; }
    @keyframes rabbit-lean {
      0%, 100% { transform: rotate(-1deg); }
      45% { transform: translateY(7px) rotate(1.5deg); }
    }
    @keyframes rabbit-dig {
      0%, 100% { transform: rotate(-7deg); }
      45% { transform: rotate(9deg); }
      70% { transform: rotate(5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rabbit, .forepaw { animation: none; }
    }
  </style>
